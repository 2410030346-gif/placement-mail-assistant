<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Mail Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="aurora" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
    </div>

    <div class="container">

        <header class="hero">
            <h1>Placement Mail Assistant</h1>
            <p class="sub">Paste a placement email. See the deadline, whether you qualify, and the proof from the original text.</p>
        </header>

        <div class="profile-section card">
            <h2>Your profile</h2>
            <div class="fields">
                <input type="text" id="batch" placeholder="Batch (Example: 2028)" aria-label="Batch">
                <input type="text" id="branch" placeholder="Branch (Example: CSE)" aria-label="Branch">
                <input type="number" step="0.1" id="cgpa" placeholder="CGPA" aria-label="CGPA">
            </div>
        </div>

        <div class="card">
            <h2>Placement email</h2>
            <textarea id="emailText" placeholder="Paste placement email here..." aria-label="Placement email text"></textarea>
            <button id="analyzeBtn" class="btn" onclick="analyzeEmail()">Analyze email</button>
        </div>

        <div id="result" aria-live="polite"></div>

        <div id="savedJobs"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
